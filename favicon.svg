<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Pearl Bipin Engineering gear</title>
  <desc id="desc">A clean cyan engineering gear on a deep navy background.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132634" />
      <stop offset="1" stop-color="#080b10" />
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a7fbff" />
      <stop offset="0.58" stop-color="#54e4ef" />
      <stop offset="1" stop-color="#62d5b2" />
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#51e3ef" stop-opacity="0.24" />
      <stop offset="1" stop-color="#51e3ef" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1bd" />
      <stop offset="1" stop-color="#ffd477" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#background)" />
  <circle cx="32" cy="32" r="30" fill="url(#halo)" />
  <g transform="translate(32 32)" fill="url(#metal)" stroke="#d7fdff" stroke-width="0.65" stroke-linejoin="round">
      <rect x="-4.1" y="-28" width="8.2" height="13" rx="2" transform="rotate(0)" />
      <rect x="-4.1" y="-28" width="8.2" height="13" rx="2" transform="rotate(30)" />
      <rect x="-4.1" y="-28" width="8.2" height="13" rx="2" transform="rotate(60)" />
      <rect x="-4.1" y="-28" width="8.2" height="13" rx="2" transform="rotate(90)" />
      <rect x="-4.1" y="-28" width="8.2" height="13" rx="2" transform="rotate(120)" />
      <rect x="-4.1" y="-28" width="8.2" height="13" rx="2" transform="rotate(150)" />
      <rect x="-4.1" y="-28" width="8.2" height="13" rx="2" transform="rotate(180)" />
      <rect x="-4.1" y="-28" width="8.2" height="13" rx="2" transform="rotate(210)" />
      <rect x="-4.1" y="-28" width="8.2" height="13" rx="2" transform="rotate(240)" />
      <rect x="-4.1" y="-28" width="8.2" height="13" rx="2" transform="rotate(270)" />
      <rect x="-4.1" y="-28" width="8.2" height="13" rx="2" transform="rotate(300)" />
      <rect x="-4.1" y="-28" width="8.2" height="13" rx="2" transform="rotate(330)" />
    <circle r="20.5" />
  </g>
  <circle cx="32" cy="32" r="10.4" fill="#0a131d" stroke="#bffaff" stroke-width="2" />
  <circle cx="32" cy="32" r="3.4" fill="url(#accent)" />
  <path d="M12 48 L16 46" stroke="#ffd477" stroke-width="1.4" stroke-linecap="round" opacity="0.8" />
</svg>
